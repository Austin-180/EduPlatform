<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduPlatform — 學習頁面</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-bg:           #f8f9fa;
      --color-surface:      #ffffff;
      --color-border:       #e5e7eb;
      --color-border-light: #f0f1f3;

      --color-primary:      #4f6ef7;
      --color-primary-light:#eef1fe;
      --color-primary-dim:  #8fa3f9;

      --color-success:      #22c55e;
      --color-warning:      #f59e0b;
      --color-danger:       #ef4444;
      --color-info:         #3b82f6;

      --color-text-1:       #111827;
      --color-text-2:       #374151;
      --color-text-3:       #6b7280;
      --color-text-4:       #9ca3af;

      --color-code-bg:      #f3f4f6;
      --color-code-border:  #e5e7eb;

      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif;
      --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;

      --nav-height:     52px;
      --left-width:     252px;
      --right-width:    308px;
      --radius-sm:      6px;
      --radius-md:      10px;
      --radius-lg:      14px;

      --shadow-sm:   0 1px 3px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.04);
      --shadow-md:   0 4px 12px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.04);
    }

    html, body { height: 100%; background: var(--color-bg); color: var(--color-text-1); font-family: var(--font-sans); font-size: 15px; line-height: 1.6; }
    #root { height: 100%; display: flex; flex-direction: column; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 999px; }

    /* ─────────────────────────────
       GLOBAL NAV
    ───────────────────────────── */
    .global-nav {
      height: var(--nav-height);
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 16px;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 700;
      color: var(--color-primary);
      text-decoration: none;
    }
    .nav-logo-icon {
      width: 28px; height: 28px;
      background: var(--color-primary);
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 13px; font-weight: 800;
    }
    .nav-sep { color: var(--color-border); font-size: 18px; }
    .nav-course-name { font-size: 13.5px; color: var(--color-text-2); font-weight: 500; }
    .nav-spacer { flex: 1; }
    .nav-progress-wrap { display: flex; align-items: center; gap: 8px; }
    .nav-progress-label { font-size: 12px; color: var(--color-text-3); }
    .nav-progress-bar-bg {
      width: 96px; height: 6px;
      background: var(--color-border);
      border-radius: 999px; overflow: hidden;
    }
    .nav-progress-bar-fill {
      height: 100%; background: var(--color-primary);
      border-radius: 999px; transition: width .4s;
    }
    .nav-progress-pct { font-size: 12px; color: var(--color-primary); font-weight: 600; }
    .nav-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--color-primary-light);
      border: 1.5px solid var(--color-primary-dim);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; color: var(--color-primary); font-weight: 700;
      cursor: pointer; margin-left: 8px;
    }

    /* ─────────────────────────────
       THREE-COLUMN SHELL
    ───────────────────────────── */
    .app-body {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ─────────────────────────────
       LEFT PANEL
    ───────────────────────────── */
    .left-panel {
      width: var(--left-width);
      min-width: var(--left-width);
      background: var(--color-surface);
      border-right: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width .25s, min-width .25s;
    }
    .left-panel.collapsed { width: 44px; min-width: 44px; }

    .left-panel-header {
      padding: 14px 14px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--color-border-light);
      flex-shrink: 0;
    }
    .left-panel-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--color-text-3);
      white-space: nowrap;
      overflow: hidden;
    }
    .icon-btn {
      width: 28px; height: 28px;
      border: none; background: none;
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--color-text-3);
      transition: background .15s, color .15s;
      flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--color-border-light); color: var(--color-text-1); }

    .left-panel-scroll { flex: 1; overflow-y: auto; padding: 8px 0; }

    /* Chapter group */
    .chapter-group { margin-bottom: 2px; }
    .chapter-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      cursor: pointer;
      user-select: none;
      border-radius: 0;
      transition: background .12s;
    }
    .chapter-header:hover { background: var(--color-border-light); }
    .chapter-arrow {
      font-size: 10px; color: var(--color-text-3);
      transition: transform .2s;
      flex-shrink: 0;
    }
    .chapter-arrow.open { transform: rotate(90deg); }
    .chapter-icon { font-size: 14px; flex-shrink: 0; }
    .chapter-title {
      font-size: 13px; font-weight: 600;
      color: var(--color-text-2);
      flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .chapter-badge {
      font-size: 10px; background: var(--color-border-light);
      color: var(--color-text-3); padding: 1px 6px;
      border-radius: 999px; flex-shrink: 0;
    }

    /* Unit item */
    .unit-list { list-style: none; }
    .unit-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 14px 5px 32px;
      cursor: pointer;
      border-left: 2px solid transparent;
      transition: background .12s, border-color .12s;
      position: relative;
    }
    .unit-item:hover { background: var(--color-border-light); }
    .unit-item.active {
      background: var(--color-primary-light);
      border-left-color: var(--color-primary);
    }
    .unit-status { font-size: 13px; flex-shrink: 0; line-height: 1; }
    .unit-label {
      font-size: 13px; color: var(--color-text-2);
      flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .unit-item.active .unit-label { color: var(--color-primary); font-weight: 600; }

    /* Progress summary */
    .left-progress-box {
      margin: 8px 12px;
      padding: 10px 12px;
      background: var(--color-bg);
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border-light);
    }
    .left-progress-row {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .left-progress-text { font-size: 12px; color: var(--color-text-3); }
    .left-progress-num { font-size: 12px; font-weight: 600; color: var(--color-text-2); }
    .left-mini-bar-bg {
      height: 4px; background: var(--color-border);
      border-radius: 999px; overflow: hidden;
    }
    .left-mini-bar-fill { height: 100%; background: var(--color-primary); border-radius: 999px; }

    /* AI suggestion */
    .ai-suggestion {
      margin: 8px 12px 12px;
      padding: 10px 12px;
      background: #fafbff;
      border: 1px solid #e0e7ff;
      border-radius: var(--radius-md);
    }
    .ai-suggestion-header {
      display: flex; align-items: center;
      gap: 6px; margin-bottom: 6px;
    }
    .ai-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--color-primary); flex-shrink: 0;
    }
    .ai-suggestion-label { font-size: 11px; color: var(--color-primary); font-weight: 600; }
    .ai-suggestion-text { font-size: 12px; color: var(--color-text-2); line-height: 1.5; margin-bottom: 8px; }
    .ai-suggestion-actions { display: flex; gap: 6px; }
    .ai-btn-sm {
      font-size: 11px; padding: 3px 8px;
      border-radius: var(--radius-sm);
      cursor: pointer; border: 1px solid;
      font-family: inherit;
      transition: background .12s;
    }
    .ai-btn-sm.primary {
      background: var(--color-primary); color: #fff;
      border-color: var(--color-primary);
    }
    .ai-btn-sm.primary:hover { background: #3d5ce0; }
    .ai-btn-sm.ghost {
      background: transparent; color: var(--color-text-3);
      border-color: var(--color-border);
    }
    .ai-btn-sm.ghost:hover { background: var(--color-border-light); }

    /* ─────────────────────────────
       MAIN PANEL
    ───────────────────────────── */
    .main-panel {
      flex: 1;
      overflow-y: auto;
      background: var(--color-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .main-content {
      width: 100%;
      max-width: 780px;
      padding: 36px 32px 80px;
    }

    /* Breadcrumb */
    .breadcrumb {
      display: flex; align-items: center;
      gap: 6px; margin-bottom: 20px;
      font-size: 12px; color: var(--color-text-3);
    }
    .breadcrumb-sep { color: var(--color-border); }
    .breadcrumb-active { color: var(--color-text-2); font-weight: 500; }

    /* Page header */
    .page-title {
      font-size: 26px; font-weight: 800;
      color: var(--color-text-1);
      line-height: 1.3;
      margin-bottom: 6px;
      letter-spacing: -.3px;
    }
    .page-meta {
      display: flex; align-items: center;
      gap: 12px; margin-bottom: 24px;
    }
    .page-meta-tag {
      font-size: 11.5px;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 500;
    }
    .tag-chapter { background: var(--color-primary-light); color: var(--color-primary); }
    .tag-time { background: #f0fdf4; color: #16a34a; }
    .tag-difficulty { background: #fef9c3; color: #a16207; }

    /* Learning goals */
    .goals-callout {
      background: var(--color-primary-light);
      border: 1px solid #c7d7fc;
      border-radius: var(--radius-md);
      margin-bottom: 28px;
      overflow: hidden;
    }
    .goals-callout-header {
      display: flex; align-items: center;
      gap: 8px; padding: 10px 16px;
      cursor: pointer; user-select: none;
      font-size: 13px; font-weight: 600; color: var(--color-primary);
    }
    .goals-callout-body { padding: 4px 16px 14px; }
    .goals-list { list-style: none; display: flex; flex-direction: column; gap: 5px; }
    .goals-list li {
      display: flex; align-items: flex-start; gap: 8px;
      font-size: 13.5px; color: var(--color-text-2);
    }
    .goals-check { color: var(--color-primary); margin-top: 1px; }

    /* Prose */
    .prose p {
      font-size: 15px; color: var(--color-text-2);
      line-height: 1.8; margin-bottom: 16px;
    }
    .prose h3 {
      font-size: 17px; font-weight: 700;
      color: var(--color-text-1);
      margin: 28px 0 10px;
    }
    .prose strong { color: var(--color-text-1); }

    /* Code block */
    .code-block {
      background: #1e2128;
      border-radius: var(--radius-md);
      margin: 20px 0;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .code-block-header {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: #161920;
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .code-lang { font-size: 11px; color: #6b7280; font-family: var(--font-mono); font-weight: 600; }
    .code-copy-btn {
      font-size: 11px; color: #9ca3af;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      padding: 3px 10px; border-radius: var(--radius-sm);
      cursor: pointer; font-family: inherit;
      transition: background .15s, color .15s;
    }
    .code-copy-btn:hover { background: rgba(255,255,255,.12); color: #fff; }
    .code-copy-btn.copied { color: var(--color-success); border-color: var(--color-success); }
    .code-block pre {
      padding: 16px 18px;
      overflow-x: auto;
      font-size: 13.5px;
      font-family: var(--font-mono);
      line-height: 1.75;
      color: #cdd6f4;
    }
    /* Minimal syntax colours */
    .tk-kw  { color: #cba6f7; }
    .tk-fn  { color: #89b4fa; }
    .tk-str { color: #a6e3a1; }
    .tk-num { color: #fab387; }
    .tk-cm  { color: #6c7086; font-style: italic; }
    .tk-op  { color: #89dceb; }

    /* Callout */
    .callout {
      display: flex; gap: 12px;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      margin: 18px 0;
      font-size: 13.5px;
      line-height: 1.6;
    }
    .callout-note    { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; }
    .callout-warn    { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; }
    .callout-tip     { background: #f0fdf4; border: 1px solid #bbf7d0; color: #14532d; }
    .callout-icon    { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
    .callout-body strong { display: block; margin-bottom: 3px; font-weight: 700; }

    /* Divider */
    .section-divider {
      display: flex; align-items: center; gap: 12px;
      margin: 36px 0 24px;
    }
    .section-divider-line { flex: 1; height: 1px; background: var(--color-border); }
    .section-divider-label {
      font-size: 11px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: var(--color-text-3);
    }

    /* Exercise */
    .exercise-block {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-sm);
    }
    .exercise-number {
      font-size: 11px; font-weight: 700;
      color: var(--color-primary); letter-spacing: .06em;
      text-transform: uppercase; margin-bottom: 8px;
    }
    .exercise-title {
      font-size: 16px; font-weight: 700;
      color: var(--color-text-1); margin-bottom: 10px;
    }
    .exercise-desc {
      font-size: 14px; color: var(--color-text-2);
      line-height: 1.7; margin-bottom: 18px;
    }
    .exercise-editor {
      background: #1e2128;
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 16px;
      border: 1px solid rgba(255,255,255,.05);
    }
    .exercise-editor-header {
      padding: 7px 14px;
      background: #161920;
      font-size: 11px; color: #6b7280;
      font-family: var(--font-mono);
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .exercise-editor textarea {
      width: 100%;
      min-height: 120px;
      background: transparent;
      border: none; outline: none;
      color: #cdd6f4;
      font-family: var(--font-mono);
      font-size: 13.5px;
      line-height: 1.75;
      padding: 14px 18px;
      resize: vertical;
    }
    .exercise-actions { display: flex; gap: 8px; align-items: center; }
    .btn {
      padding: 8px 18px;
      border-radius: var(--radius-sm);
      font-size: 13.5px; font-weight: 600;
      cursor: pointer; border: none;
      font-family: inherit;
      display: inline-flex; align-items: center; gap: 6px;
      transition: background .15s, transform .1s, box-shadow .15s;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary {
      background: var(--color-primary); color: #fff;
      box-shadow: 0 1px 4px rgba(79,110,247,.3);
    }
    .btn-primary:hover { background: #3d5ce0; }
    .btn-outline {
      background: transparent; color: var(--color-text-2);
      border: 1px solid var(--color-border);
    }
    .btn-outline:hover { background: var(--color-border-light); color: var(--color-primary); border-color: var(--color-primary-dim); }

    /* Completion banner */
    .completion-banner {
      margin-top: 36px;
      background: linear-gradient(135deg, #f0fdf4 0%, #ecfeff 100%);
      border: 1px solid #bbf7d0;
      border-radius: var(--radius-lg);
      padding: 24px;
      text-align: center;
    }
    .completion-icon { font-size: 32px; margin-bottom: 8px; }
    .completion-title { font-size: 17px; font-weight: 800; color: #14532d; margin-bottom: 4px; }
    .completion-sub { font-size: 13px; color: #166534; margin-bottom: 16px; }
    .completion-tags { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
    .completion-tag {
      font-size: 12px; padding: 3px 10px;
      background: #dcfce7; color: #166534;
      border-radius: 999px; font-weight: 500;
    }
    .completion-actions { display: flex; justify-content: center; gap: 10px; }
    .btn-success { background: #16a34a; color: #fff; }
    .btn-success:hover { background: #15803d; }

    /* Page nav */
    .page-nav {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 48px;
      padding-top: 20px;
      border-top: 1px solid var(--color-border);
    }
    .page-nav-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 16px; border-radius: var(--radius-md);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      cursor: pointer; font-family: inherit;
      transition: background .12s, border-color .12s;
    }
    .page-nav-btn:hover { background: var(--color-primary-light); border-color: var(--color-primary-dim); }
    .page-nav-dir { font-size: 11px; color: var(--color-text-3); }
    .page-nav-label { font-size: 13px; font-weight: 600; color: var(--color-text-1); }

    /* ─────────────────────────────
       RIGHT PANEL
    ───────────────────────────── */
    .right-panel {
      width: var(--right-width);
      min-width: var(--right-width);
      background: var(--color-surface);
      border-left: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width .25s, min-width .25s;
    }
    .right-panel.collapsed { width: 44px; min-width: 44px; }

    .right-panel-header {
      padding: 14px 14px 0;
      flex-shrink: 0;
    }
    .right-panel-top {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .right-panel-title {
      font-size: 11px; font-weight: 700;
      letter-spacing: .07em; text-transform: uppercase;
      color: var(--color-text-3);
    }

    /* Tool tabs */
    .tool-tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--color-border-light);
      scrollbar-width: none;
    }
    .tool-tabs::-webkit-scrollbar { display: none; }
    .tool-tab {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 5px;
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      font-size: 12px; font-weight: 600;
      cursor: pointer; border: 1px solid transparent;
      background: none; font-family: inherit;
      color: var(--color-text-3);
      transition: background .12s, color .12s, border-color .12s;
      white-space: nowrap;
    }
    .tool-tab:hover { background: var(--color-border-light); color: var(--color-text-2); }
    .tool-tab.active {
      background: var(--color-primary-light);
      color: var(--color-primary);
      border-color: #c7d7fc;
    }
    .tool-tab-icon { font-size: 13px; }

    /* Tool content */
    .tool-content { flex: 1; overflow-y: auto; padding: 16px 14px; }

    /* Tool idle */
    .tool-idle {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 160px; text-align: center;
      gap: 8px;
    }
    .tool-idle-icon { font-size: 28px; opacity: .4; }
    .tool-idle-text { font-size: 12.5px; color: var(--color-text-3); line-height: 1.5; max-width: 180px; }
    .tool-trigger-btn {
      margin-top: 8px;
      font-size: 12.5px; padding: 6px 14px;
      border-radius: var(--radius-sm);
      background: var(--color-primary); color: #fff;
      border: none; cursor: pointer; font-family: inherit;
      font-weight: 600;
      transition: background .12s;
    }
    .tool-trigger-btn:hover { background: #3d5ce0; }

    /* Summary output */
    .tool-summary-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .tool-summary-item {
      display: flex; gap: 8px;
      font-size: 13px; color: var(--color-text-2);
      line-height: 1.55;
    }
    .tool-summary-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--color-primary);
      flex-shrink: 0; margin-top: 6px;
    }

    /* Hint tool */
    .hint-layer {
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-bottom: 10px;
      font-size: 13px; color: var(--color-text-2);
      line-height: 1.6;
    }
    .hint-layer-label {

      color: var(--color-text-3); margin-bottom: 5px;

    .hint-more-btn {
      width: 100%; padding: 8px;

      border: 1px dashed var(--color-border);

    /* Explain tool */
    .tool-input-row {
      display: flex; gap: 6px; margin-bottom: 12px;
    }
    .tool-input {
      flex: 1; padding: 8px 10px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-size: 13px; font-family: inherit;
      background: var(--color-bg); color: var(--color-text-1);
      outline: none; transition: border-color .15s;
    }
    .tool-input:focus { border-color: var(--color-primary); }
    .tool-submit-btn {
      padding: 8px 12px;
      background: var(--color-primary); color: #fff;
      border: none; border-radius: var(--radius-sm);
      cursor: pointer; font-size: 13px; font-family: inherit;
      font-weight: 600; transition: background .12s;
    }
    .tool-submit-btn:hover { background: #3d5ce0; }
    .tool-explain-result {
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      font-size: 13px; color: var(--color-text-2);
      line-height: 1.65;
    }

    /* Debug tool */
    .tool-debug-editor {
      background: #1e2128;
      border-radius: var(--radius-md);
      overflow: hidden; margin-bottom: 10px;
    }
    .tool-debug-editor-hdr {
      padding: 6px 12px;
      background: #161920;
      font-size: 11px; color: #6b7280;
      font-family: var(--font-mono);
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .tool-debug-editor textarea {
      width: 100%; min-height: 90px;
      background: transparent; border: none; outline: none;
      color: #cdd6f4; font-family: var(--font-mono);
      font-size: 12.5px; line-height: 1.7;
      padding: 10px 14px; resize: vertical;
    }
    .debug-result {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: var(--radius-md);
      padding: 12px 14px;
      font-size: 12.5px; color: #92400e; line-height: 1.6;
    }
    .debug-result strong { display: block; margin-bottom: 4px; }

    /* MindMap */
    .mindmap-wrap { padding: 8px 0; }
    .mindmap-root {
      background: var(--color-primary-light);
      border: 1.5px solid var(--color-primary-dim);
      border-radius: var(--radius-md);
      padding: 8px 14px;
      font-size: 13px; font-weight: 700;
      color: var(--color-primary);
      text-align: center;
      margin-bottom: 12px;
    }
    .mindmap-branches { display: flex; flex-direction: column; gap: 6px; padding-left: 14px; }
    .mindmap-branch {
      border-left: 2px solid var(--color-border);
      padding-left: 12px;
    }
    .mindmap-branch-label {
      font-size: 12.5px; font-weight: 700;
      color: var(--color-text-2); margin-bottom: 4px;
    }
    .mindmap-leaf {
      font-size: 12px; color: var(--color-text-3);
      padding: 2px 0 2px 10px;
      border-left: 1px solid var(--color-border-light);
      margin-left: 4px;
    }

    /* Tool disclaimer */
    .tool-disclaimer {
      padding: 10px 14px;
      border-top: 1px solid var(--color-border-light);
      font-size: 11px; color: var(--color-text-4);
      line-height: 1.5; flex-shrink: 0;
      text-align: center;
    }

    /* ── Loading shimmer ── */
    .shimmer {
      display: flex; flex-direction: column; gap: 8px;
    }
    .shimmer-line {
      height: 12px; border-radius: 6px;
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ── Mock Data ── */
const COURSE_DATA = [
  {
    id: 'ch1', title: '第一章　基礎概念', icon: '📌',
    units: [
      { id: 'u1', label: '1.1 變數與資料型別', status: 'done' },
      { id: 'u2', label: '1.2 運算子與表達式', status: 'done' },
      { id: 'u3', label: '1.3 輸入與輸出', status: 'done' },
    ],
  },
  {
    id: 'ch2', title: '第二章　控制流', icon: '🔀',
    units: [
      { id: 'u4', label: '2.1 if / else 條件判斷', status: 'done' },
      { id: 'u5', label: '2.2 for 與 while 迴圈', status: 'active' },
      { id: 'u6', label: '2.3 巢狀迴圈與 break', status: 'pending' },
    ],
  },
  {
    id: 'ch3', title: '第三章　函式設計', icon: '🧩',
    units: [
      { id: 'u7', label: '3.1 定義與呼叫函式', status: 'done' },
      { id: 'u8', label: '3.2 遞迴函式', status: 'current' },
      { id: 'u9', label: '3.3 匿名函式 Lambda', status: 'pending' },
    ],
  },
  {
    id: 'ch4', title: '第四章　資料結構', icon: '📦',
    units: [
      { id: 'u10', label: '4.1 列表與元組', status: 'pending' },
      { id: 'u11', label: '4.2 字典與集合', status: 'pending' },
      { id: 'u12', label: '4.3 堆疊與佇列', status: 'pending' },
    ],
  },
];

const STATUS_ICON = { done: '✓', active: '◐', current: '▶', pending: '○' };

/* ── CodeBlock ── */
function CodeBlock({ lang, children, copyable = true }) {
  const [copied, setCopied] = useState(false);
  const copy = () => {
    const text = children.replace(/<[^>]+>/g, '');
    navigator.clipboard?.writeText(text).catch(() => {});
    setCopied(true);
    setTimeout(() => setCopied(false), 1800);
  };
  return (
    <div className="code-block">
      <div className="code-block-header">
        <span className="code-lang">{lang}</span>
        {copyable && (
          <button className={`code-copy-btn${copied ? ' copied' : ''}`} onClick={copy}>
            {copied ? '✓ 已複製' : '複製'}
          </button>
        )}
      </div>
      <pre dangerouslySetInnerHTML={{ __html: children }} />
    </div>
  );
}

/* ── Callout ── */
function Callout({ type, title, children }) {
  const config = {
    note:  { cls: 'callout-note', icon: 'ℹ️' },
    warn:  { cls: 'callout-warn', icon: '⚠️' },
    tip:   { cls: 'callout-tip',  icon: '💡' },
  }[type] || { cls: 'callout-note', icon: 'ℹ️' };
  return (
    <div className={`callout ${config.cls}`}>
      <span className="callout-icon">{config.icon}</span>
      <div className="callout-body">
        {title && <strong>{title}</strong>}
        {children}
      </div>
    </div>
  );
}

/* ── Left Panel ── */
function LeftPanel({ collapsed, onToggle }) {
  const [openChapters, setOpenChapters] = useState({ ch1: false, ch2: true, ch3: true, ch4: false });
  const [showSuggestion, setShowSuggestion] = useState(true);
  const toggleChapter = id => setOpenChapters(p => ({ ...p, [id]: !p[id] }));

  return (
    <aside className={`left-panel${collapsed ? ' collapsed' : ''}`}>
      <div className="left-panel-header">
        {!collapsed && <span className="left-panel-title">課程目錄</span>}
        <button className="icon-btn" onClick={onToggle} title={collapsed ? '展開' : '收合'}>
          {collapsed ? '›' : '‹'}
        </button>
      </div>

      {!collapsed && (
        <>
          <div className="left-panel-scroll">
            {COURSE_DATA.map(ch => (
              <div className="chapter-group" key={ch.id}>
                <div className="chapter-header" onClick={() => toggleChapter(ch.id)}>
                  <span className={`chapter-arrow${openChapters[ch.id] ? ' open' : ''}`}>▶</span>
                  <span className="chapter-icon">{ch.icon}</span>
                  <span className="chapter-title">{ch.title}</span>
                  <span className="chapter-badge">
                    {ch.units.filter(u => u.status === 'done').length}/{ch.units.length}
                  </span>
                </div>
                {openChapters[ch.id] && (
                  <ul className="unit-list">
                    {ch.units.map(u => (
                      <li
                        key={u.id}
                        className={`unit-item${u.status === 'current' ? ' active' : ''}`}
                      >
                        <span className="unit-status">
                          {u.status === 'done' ? '✓' : u.status === 'current' ? '▶' : u.status === 'active' ? '◐' : '○'}
                        </span>
                        <span className="unit-label">{u.label}</span>
                      </li>
                    ))}
                  </ul>
                )}
              </div>
            ))}

            {/* Progress */}
            <div className="left-progress-box">
              <div className="left-progress-row">
                <span className="left-progress-text">整體進度</span>
                <span className="left-progress-num">4 / 12 完成</span>
              </div>
              <div className="left-mini-bar-bg">
                <div className="left-mini-bar-fill" style={{ width: '33%' }} />
              </div>
            </div>

            {/* AI suggestion */}
            {showSuggestion && (
              <div className="ai-suggestion">
                <div className="ai-suggestion-header">
                  <span className="ai-dot" />
                  <span className="ai-suggestion-label">AI 路徑建議</span>
                </div>
                <p className="ai-suggestion-text">
                  建議先複習 <strong>2.3 巢狀迴圈</strong> 後再繼續 3.2，遞迴概念與迴圈思維高度相關。
                </p>
                <div className="ai-suggestion-actions">
                  <button className="ai-btn-sm primary">查看</button>
                  <button className="ai-btn-sm ghost" onClick={() => setShowSuggestion(false)}>略過</button>
                </div>
              </div>
            )}
          </div>
        </>
      )}
    </aside>
  );
}

/* ── Right Panel Tools ── */
const TOOLS = [
  { id: 'summary',  label: '摘要',   icon: '📋' },
  { id: 'mindmap',  label: '心智圖', icon: '🗺️' },
  { id: 'explain',  label: '概念解釋', icon: '💬' },
  { id: 'hint',     label: '解題提示', icon: '💡' },
  { id: 'debug',    label: 'Debug',  icon: '🐛' },
];

function ToolSummary() {
  const [loaded, setLoaded] = useState(false);
  useEffect(() => { const t = setTimeout(() => setLoaded(true), 900); return () => clearTimeout(t); }, []);
  if (!loaded) return (
    <div className="shimmer">
      {[100, 85, 92, 70].map((w, i) => (
        <div key={i} className="shimmer-line" style={{ width: `${w}%` }} />
      ))}
    </div>
  );
  return (
    <ul className="tool-summary-list">
      {[
        '遞迴是函式呼叫自身的設計模式，透過縮小問題規模來逐步求解。',
        'Base case（基礎情況）是遞迴的終止條件，缺少它會導致無窮遞迴並觸發 stack overflow。',
        '每一次遞迴呼叫都會在呼叫堆疊中保留當前的執行環境。',
        'Fibonacci 數列和階乘計算是最常見的遞迴應用範例。',
        '遞迴的時間複雜度需注意重複計算問題，可搭配記憶化（memoization）優化。',
      ].map((text, i) => (
        <li key={i} className="tool-summary-item">
          <span className="tool-summary-dot" />
          <span>{text}</span>
        </li>
      ))}
    </ul>
  );
}

function ToolMindMap() {
  return (
    <div className="mindmap-wrap">
      <div className="mindmap-root">遞迴函式</div>
      <div className="mindmap-branches">
        {[
          { label: '核心概念', leaves: ['自我呼叫', 'Base case', 'Recursive case'] },
          { label: '執行機制', leaves: ['Call Stack', '堆疊幀', 'Stack Overflow'] },
          { label: '常見範例', leaves: ['階乘 factorial(n)', 'Fibonacci 數列', '二元搜尋'] },
          { label: '優化技巧', leaves: ['記憶化 Memoization', '尾遞迴優化', '轉換為迴圈'] },
        ].map(b => (
          <div key={b.label} className="mindmap-branch">
            <div className="mindmap-branch-label">▸ {b.label}</div>
            {b.leaves.map(l => <div key={l} className="mindmap-leaf">· {l}</div>)}
          </div>
        ))}
      </div>
    </div>
  );
}

function ToolExplain() {
  const [query, setQuery] = useState('');
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const PRESET = '我在讀「3.2 遞迴函式」，請解釋：';
  const ask = () => {
    if (!query.trim()) return;
    setLoading(true); setResult(null);
    setTimeout(() => {
      setLoading(false);
      setResult(`**${query.trim()}**\n\n在遞迴中，每次函式呼叫自身時，Python 會在 Call Stack 上建立新的「堆疊幀（Stack Frame）」，儲存該次呼叫的局部變數與返回位址。當 Base case 被觸發，函式開始逐層返回，堆疊幀依序彈出，最終回到最初的呼叫點。\n\n這就是為什麼遞迴層數過深時會發生 RecursionError：堆疊空間有限，超過就會 overflow。`);
    }, 1100);
  };
  return (
    <div>
      <p style={{ fontSize: 12, color: 'var(--color-text-3)', marginBottom: 8 }}>
        已帶入當前章節脈絡，直接輸入你的問題：
      </p>
      <div style={{ fontSize: 12, color: 'var(--color-primary)', background: 'var(--color-primary-light)', padding: '5px 10px', borderRadius: 6, marginBottom: 8 }}>
        {PRESET}
      </div>
      <div className="tool-input-row">
        <input
          className="tool-input"
          placeholder="例：Call Stack 是什麼？"
          value={query}
          onChange={e => setQuery(e.target.value)}
          onKeyDown={e => e.key === 'Enter' && ask()}
        />
        <button className="tool-submit-btn" onClick={ask}>送出</button>
      </div>
      {loading && (
        <div className="shimmer">
          {[100, 90, 95, 70, 85].map((w, i) => (
            <div key={i} className="shimmer-line" style={{ width: `${w}%` }} />
          ))}
        </div>
      )}
      {result && (
        <div className="tool-explain-result">
          {result.split('\n\n').map((p, i) => (
            <p key={i} style={{ marginBottom: i < result.split('\n\n').length - 1 ? 10 : 0 }}>{p}</p>
          ))}
        </div>
      )}
    </div>
  );
}

function ToolHint() {
  const [level, setLevel] = useState(0);
  const HINTS = [
    { label: '提示 1 — 思路方向', text: '想想看：Fibonacci 數列中，每個數字和前兩個數字有什麼關係？能不能用這個關係寫出遞迴的 recursive case？' },
    { label: '提示 2 — 結構提示', text: '你需要兩個 base case：當 n == 0 時回傳 0，當 n == 1 時回傳 1。遞迴 case 則是回傳 fibonacci(n-1) + fibonacci(n-2)。' },
    { label: '提示 3 — 完整提示', text: 'def fibonacci(n):\n    if n == 0: return 0\n    if n == 1: return 1\n    return fibonacci(n-1) + fibonacci(n-2)' },
  ];
  return (
    <div>
      <p style={{ fontSize: 12, color: 'var(--color-text-3)', marginBottom: 12 }}>
        針對練習題「費氏數列遞迴函式」的分層提示：
      </p>
      {HINTS.slice(0, level + 1).map((h, i) => (
        <div key={i} className="hint-layer">
          <div className="hint-layer-label">{h.label}</div>
          {h.text.includes('\n') ? (
            <pre style={{ fontFamily: 'var(--font-mono)', fontSize: 12, color: 'var(--color-text-1)', whiteSpace: 'pre-wrap' }}>{h.text}</pre>
          ) : h.text}
        </div>
      ))}
      {level < HINTS.length - 1 && (
        <button className="hint-more-btn" onClick={() => setLevel(l => l + 1)}>
          還是不懂，再給一個提示 →
        </button>
      )}
      {level === HINTS.length - 1 && (
        <p style={{ fontSize: 12, color: 'var(--color-text-3)', textAlign: 'center', marginTop: 8 }}>
          已顯示完整提示，試著自己實作看看！
        </p>
      )}
    </div>
  );
}

function ToolDebug() {
  const [code, setCode] = useState('');
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const analyze = () => {
    if (!code.trim()) return;
    setLoading(true); setResult(null);
    setTimeout(() => {
      setLoading(false);
      setResult({
        error: 'Missing base case — 遞迴缺少終止條件',
        detail: '你的函式會無限呼叫自己，因為沒有 if n == 0 或 if n == 1 的返回條件。Python 預設遞迴深度限制為 1000 層，超過會拋出 RecursionError。',
        fix: '在函式開頭加上：\nif n <= 1: return n',
      });
    }, 1000);
  };
  return (
    <div>
      <p style={{ fontSize: 12, color: 'var(--color-text-3)', marginBottom: 8 }}>貼上你的程式碼，AI 幫你分析錯誤：</p>
      <div className="tool-debug-editor">
        <div className="tool-debug-editor-hdr">python</div>
        <textarea
          placeholder="# 貼上你的程式碼..."
          value={code}
          onChange={e => setCode(e.target.value)}
        />
      </div>
      <button className="btn btn-primary" style={{ width: '100%', justifyContent: 'center', marginBottom: 12 }} onClick={analyze}>
        分析錯誤
      </button>
      {loading && (
        <div className="shimmer">
          {[100, 80, 90].map((w, i) => (
            <div key={i} className="shimmer-line" style={{ width: `${w}%` }} />
          ))}
        </div>
      )}
      {result && (
        <div className="debug-result">
          <strong>⚠ {result.error}</strong>
          <p style={{ marginBottom: 8 }}>{result.detail}</p>
          <strong>建議修正：</strong>
          <pre style={{ fontFamily: 'var(--font-mono)', fontSize: 12, marginTop: 4 }}>{result.fix}</pre>
        </div>
      )}
    </div>
  );
}

function RightPanel({ collapsed, onToggle, activeToolProp }) {
  const [activeTool, setActiveTool] = useState(activeToolProp || null);

  useEffect(() => {
    if (activeToolProp) setActiveTool(activeToolProp);
  }, [activeToolProp]);

  const ToolBody = () => {
    if (!activeTool) return (
      <div className="tool-idle">
        <div className="tool-idle-icon">🧰</div>
        <p className="tool-idle-text">選擇上方工具，讓 AI 幫你整理摘要、解釋概念或協助 Debug。</p>
      </div>
    );
    return {
      summary: <ToolSummary />,
      mindmap: <ToolMindMap />,
      explain: <ToolExplain />,
      hint:    <ToolHint />,
      debug:   <ToolDebug />,
    }[activeTool] || null;
  };

  return (
    <aside className={`right-panel${collapsed ? ' collapsed' : ''}`}>
      {collapsed ? (
        <div style={{ padding: '14px 8px', display: 'flex', flexDirection: 'column', gap: 8, alignItems: 'center' }}>
          <button className="icon-btn" onClick={onToggle} title="展開工具箱">‹</button>
          {TOOLS.map(t => (
            <button key={t.id} className="icon-btn" title={t.label} onClick={() => { onToggle(); setActiveTool(t.id); }} style={{ fontSize: 16 }}>
              {t.icon}
            </button>
          ))}
        </div>
      ) : (
        <>
          <div className="right-panel-header">
            <div className="right-panel-top">
              <span className="right-panel-title">AI 工具箱</span>
              <button className="icon-btn" onClick={onToggle} title="收合">›</button>
            </div>
            <div className="tool-tabs">
              {TOOLS.map(t => (
                <button
                  key={t.id}
                  className={`tool-tab${activeTool === t.id ? ' active' : ''}`}
                  onClick={() => setActiveTool(t.id)}
                >
                  <span className="tool-tab-icon">{t.icon}</span>
                  {t.label}
                </button>
              ))}
            </div>
          </div>
          <div className="tool-content">
            <ToolBody />
          </div>
          <div className="tool-disclaimer">
            以上內容由 AI 生成，請自行判斷正確性。
          </div>
        </>
      )}
    </aside>
  );
}

/* ── Exercise Block ── */
function ExerciseBlock({ onHintClick }) {
  const [code, setCode] = useState('def fibonacci(n):\n    # 在這裡寫你的程式碼\n    pass\n');
  const [submitted, setSubmitted] = useState(false);
  return (
    <div className="exercise-block">
      <div className="exercise-number">練習題 3.2 — 1</div>
      <div className="exercise-title">實作費氏數列遞迴函式</div>
      <div className="exercise-desc">
        寫一個遞迴函式 <code style={{ fontFamily: 'var(--font-mono)', fontSize: 13, background: '#f3f4f6', padding: '1px 5px', borderRadius: 4 }}>fibonacci(n)</code>，
        回傳費氏數列第 n 項的值。記得考慮 base case！
        <br /><br />
        範例：<code style={{ fontFamily: 'var(--font-mono)', fontSize: 13, background: '#f3f4f6', padding: '1px 5px', borderRadius: 4 }}>fibonacci(6)</code> → <strong>8</strong>
      </div>
      <div className="exercise-editor">

/* ── Main Content ── */
function MainContent({ onHintClick }) {
  const [goalsOpen, setGoalsOpen] = useState(true);
  const [showCompletion, setShowCompletion] = useState(false);
  return (
    <div className="main-content">
      {/* Breadcrumb */}
      <nav className="breadcrumb">
        <span>Python 基礎課程</span>
        <span className="breadcrumb-sep">/</span>
        <span>第三章　函式設計</span>
        <span className="breadcrumb-sep">/</span>
        <span className="breadcrumb-active">3.2 遞迴函式</span>
      </nav>

      {/* Title */}
      <h1 className="page-title">3.2 遞迴函式</h1>
      <div className="page-meta">
        <span className="page-meta-tag tag-chapter">第三章</span>
        <span className="page-meta-tag tag-time">⏱ 約 25 分鐘</span>
        <span className="page-meta-tag tag-difficulty">★★☆ 中等</span>
      </div>

      {/* Goals */}
      <div className="goals-callout">
        <div className="goals-callout-header" onClick={() => setGoalsOpen(o => !o)}>
          <span>📌</span>
          <span>學習目標</span>
          <span style={{ marginLeft: 'auto', fontSize: 12 }}>{goalsOpen ? '▲' : '▼'}</span>
        </div>
        {goalsOpen && (
          <div className="goals-callout-body">
            <ul className="goals-list">
              {[
                '理解遞迴函式的定義與運作原理',
                '能識別並撰寫正確的 base case',
                '理解 Call Stack 如何處理遞迴呼叫',
                '能用遞迴實作階乘與費氏數列',
              ].map((g, i) => (
                <li key={i}>
                  <span className="goals-check">✓</span>
                  <span>{g}</span>
                </li>
              ))}
            </ul>
          </div>
        )}
      </div>

      {/* Content */}
      <div className="prose">
        <p>
          <strong>遞迴（Recursion）</strong>是一種程式設計技巧，讓函式在執行過程中呼叫自己。
          這種模式特別適合用來解決「可以將大問題拆解成相同結構的小問題」的情境，
          例如階乘計算、費氏數列、樹狀結構的遍歷等。
        </p>

        <h3>為什麼需要遞迴？</h3>
        <p>
          試想計算 5 的階乘（5!）。你可以用迴圈，也可以發現一個規律：
          5! = 5 × 4!，而 4! = 4 × 3!，依此類推。這種「把問題縮小」的思維，
          正是遞迴的本質。
        </p>

        <CodeBlock lang="python">{
`<span class="tk-cm"># 用遞迴計算階乘</span>
<span class="tk-kw">def</span> <span class="tk-fn">factorial</span>(n):
    <span class="tk-kw">if</span> n <span class="tk-op">==</span> <span class="tk-num">0</span>:           <span class="tk-cm"># base case：終止條件</span>
        <span class="tk-kw">return</span> <span class="tk-num">1</span>
    <span class="tk-kw">return</span> n <span class="tk-op">*</span> <span class="tk-fn">factorial</span>(n <span class="tk-op">-</span> <span class="tk-num">1</span>)  <span class="tk-cm"># recursive case</span>

<span class="tk-fn">print</span>(<span class="tk-fn">factorial</span>(<span class="tk-num">5</span>))  <span class="tk-cm"># 輸出：120</span>`
        }</CodeBlock>

        <Callout type="note" title="Base Case 是遞迴的生命線">
          每個遞迴函式都必須有一個明確的 base case，讓遞迴在某個條件下停止。
          沒有 base case 的遞迴會無窮執行，最終導致 <code style={{ fontFamily: 'var(--font-mono)', fontSize: 13 }}>RecursionError: maximum recursion depth exceeded</code>。
        </Callout>

        <h3>Call Stack 如何處理遞迴？</h3>
        <p>
          每次呼叫函式，Python 都會在 <strong>Call Stack（呼叫堆疊）</strong>上建立一個新的「堆疊幀」，
          用來儲存該次呼叫的局部變數和返回位址。遞迴呼叫時，堆疊幀會不斷累積，
          直到 base case 被觸發，才開始逐層返回並彈出堆疊幀。
        </p>

        <CodeBlock lang="python">{
`<span class="tk-cm"># 執行 factorial(3) 的 Call Stack 示意</span>
<span class="tk-cm"># ┌────────────────────────┐</span>
<span class="tk-cm"># │ factorial(0) → 1       │  ← 最頂層，base case 觸發</span>
<span class="tk-cm"># │ factorial(1) → 1×1=1   │</span>
<span class="tk-cm"># │ factorial(2) → 2×1=2   │</span>
<span class="tk-cm"># │ factorial(3) → 3×2=6   │  ← 最底層，最初的呼叫</span>
<span class="tk-cm"># └────────────────────────┘</span>
<span class="tk-fn">print</span>(<span class="tk-fn">factorial</span>(<span class="tk-num">3</span>))  <span class="tk-cm"># 輸出：6</span>`
        }</CodeBlock>

        <Callout type="warn" title="注意效能問題">
          直接使用遞迴計算 Fibonacci 數列時，相同的子問題會被重複計算多次，
          造成指數級的時間複雜度 O(2ⁿ)。實務上可搭配 <strong>記憶化（Memoization）</strong> 優化，
          或改用動態規劃（DP）解決。
        </Callout>

        <Callout type="tip" title="遞迴的思考框架">
          寫遞迴時，先問自己三個問題：(1) 最簡單的情況是什麼（base case）？
          (2) 如何把大問題縮小一步？(3) 縮小後的問題和原問題結構一樣嗎？
        </Callout>
      </div>

      {/* Exercise */}
      <div className="section-divider">
        <div className="section-divider-line" />
        <span className="section-divider-label">練習題</span>
        <div className="section-divider-line" />
      </div>

      <ExerciseBlock onHintClick={onHintClick} />

      {/* Completion */}
      {!showCompletion ? (
        <div style={{ textAlign: 'center', marginTop: 32 }}>
          <button className="btn btn-outline" onClick={() => setShowCompletion(true)}>
            ✓ 標記本單元完成
          </button>
        </div>
      ) : (
        <CompletionBanner />
      )}

      {/* Page nav */}
      <div className="page-nav">
        <button className="page-nav-btn">
          <div>
            <div className="page-nav-dir">← 上一單元</div>
            <div className="page-nav-label">3.1 定義與呼叫函式</div>
          </div>
        </button>
        <button className="page-nav-btn" style={{ textAlign: 'right' }}>
          <div>
            <div className="page-nav-dir">下一單元 →</div>
            <div className="page-nav-label">3.3 匿名函式 Lambda</div>
          </div>
        </button>
      </div>
    </div>
  );
}
